<!DOCTYPE html>
<html>
<head>
  <title>Rainwater App</title>
  <style>
    body { font-family: Arial, sans-serif; }
    #map { width: 100%; height: 500px; margin: 10px 0; }
    #solution { margin: 10px 0; font-size: 1.1em; padding: 10px; background: #f4f4f4; border-radius: 6px; }
    #priorities { display: none; margin: 10px 0; padding: 12px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
    #priorities h3 { margin: 0 0 8px 0; font-size: 1em; }
    #priorities select { padding: 6px 10px; font-size: 0.95em; border: 1px solid #999; border-radius: 6px; background: #fff; }
    #ranking { margin-top: 10px; }
    #ranking div { padding: 4px 0; border-top: 1px solid #eee; }
    #ranking div:first-child { border-top: none; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Rainwater App</h1>
  <p>Click on a plot to see its recommended Nature-Based Solution, calculated from our GIS suitability layers.</p>

  <div id="map"></div>
  <div id="solution">Loading GIS data, please wait...</div>

  <div id="priorities">
    <h3>More than one solution fits this plot — what matters most to you?</h3>
    <select id="prioritySelect">
      <option value="" disabled selected>Choose a priority...</option>
      <option value="cost">Cost</option>
      <option value="retention">Water Retention</option>
      <option value="maintenance">Maintenance</option>
    </select>
    <div id="ranking"></div>
  </div>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAuF4yjKZWnaZ2aRxwLBKf4V6VXlbjI2Ag&callback=initMap" async defer></script>
  <script>
    var map;
    var marker = null;

    var LABELS = {
      GR: 'Green Roof',
      IT: 'Infiltration Trench',
      BS: 'Bioswale',
      RG: 'Rain Garden',
      CIS: 'Rainwater Cistern'
    };

    var CRITERIA = {
      RG:  { cost: 5, retention: 5, maintenance: 5 },
      BS:  { cost: 2, retention: 4, maintenance: 2 },
      GR:  { cost: 1, retention: 3, maintenance: 1 },
      IT:  { cost: 3, retention: 2, maintenance: 3 },
      CIS: { cost: 4, retention: 1, maintenance: 4 }
    };

    var BASE = 'https://raw.githubusercontent.com/dewminanayakkara1/Rainwater-Management/refs/heads/main/';

    function fetchJSON(filename) {
      return fetch(BASE + encodeURIComponent(filename)).then(function (res) {
        if (!res.ok) throw new Error(filename + ' returned ' + res.status);
        return res.json();
      });
    }

    function sumByPlot(features, fieldOrFields, filterFn) {
      var fields = Array.isArray(fieldOrFields) ? fieldOrFields : [fieldOrFields];
      var out = {};
      features.forEach(function (f) {
        var p = f.properties;
        if (filterFn && !filterFn(p)) return;
        var id = p['flstkennz_'];
        if (!id) return;
        var val = NaN;
        for (var i = 0; i < fields.length; i++) {
          val = parseFloat(p[fields[i]]);
          if (!isNaN(val)) break;
        }
        if (isNaN(val)) return;
        out[id] = (out[id] || 0) + val;
      });
      return out;
    }

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 50.912, lng: 6.7094 },
        zoom: 16
      });

      Promise.all([
        fetchJSON('Horrem plots.geojson'),
        fetchJSON('Green Roof Suitability.geojson'),
        fetchJSON('Infiltration Trench Suitability.geojson'),
        fetchJSON('Bioswale Suitability.geojson'),
        fetchJSON('Rain Garden Suitability.geojson'),
        fetchJSON('Rainwater Cistern Suitability.geojson')
      ]).then(function (results) {
        var plots = results[0];
        var gr = results[1].features;
        var it = results[2].features;
        var bs = results[3].features;
        var rg = results[4].features;
        var cis = results[5].features;

        var grAreaByPlot = sumByPlot(gr, ['modarea'], function (p) { return p['feasible'] === 1; });
        var itAreaByPlot = sumByPlot(it, ['A new', 'ITarea', 'IT area']);
        var bsAreaByPlot = sumByPlot(bs, ['S A', 's area', 'final area']);
        var rgAreaByPlot = sumByPlot(rg, ['area final', 'rg area']);
        var cisSuitablePlots = {};
        cis.forEach(function (f) {
          var id = f.properties['flstkennz_'];
          if (id) cisSuitablePlots[id] = true;
        });

        plots.features.forEach(function (f) {
          var id = f.properties['flstkennz_'];
          var areas = {
            GR: grAreaByPlot[id] || 0,
            IT: itAreaByPlot[id] || 0,
            BS: bsAreaByPlot[id] || 0,
            RG: rgAreaByPlot[id] || 0
          };
          var cisSuitable = !!cisSuitablePlots[id];

          var candidates = Object.keys(areas).filter(function (code) { return areas[code] > 0; });
          if (cisSuitable) candidates.push('CIS');

          f.properties.candidate_codes = candidates;
        });

        map.data.addGeoJson(plots);
        map.data.setStyle({
          fillOpacity: 0,
          strokeColor: '#555555',
          strokeWeight: 1
        });

        map.data.addListener('click', function (event) {
          showPlot(event.feature, event.latLng);
        });

        document.getElementById('solution').innerText = 'Click a highlighted plot to see its recommended solution.';
      }).catch(function (err) {
        document.getElementById('solution').innerText = 'Could not load GIS data: ' + err.message;
      });
    }

    var currentCandidates = [];

    function showPlot(feature, latLng) {
      if (marker) marker.setMap(null);
      marker = new google.maps.Marker({ position: latLng, map: map });

      var address = feature.getProperty('lagebeztxt');
      var candidates = feature.getProperty('candidate_codes') || [];
      var header = address ? '<b>' + address + '</b><br>' : '';
      var prioritiesBox = document.getElementById('priorities');

      if (candidates.length === 0) {
        prioritiesBox.style.display = 'none';
        document.getElementById('solution').innerHTML = header + 'No suitable Nature-Based Solution identified yet for this plot.';
        return;
      }

      if (candidates.length === 1) {
        prioritiesBox.style.display = 'none';
        document.getElementById('solution').innerHTML =
          header + 'Recommended Nature-Based Solution: <b>' + LABELS[candidates[0]] + '</b>';
        return;
      }

      document.getElementById('solution').innerHTML =
        header + 'Several solutions are suitable here (' + candidates.map(function (c) { return LABELS[c]; }).join(', ') + ').' +
        ' Pick what matters most to you below.';
      currentCandidates = candidates;
      prioritiesBox.style.display = 'block';
      document.getElementById('ranking').innerHTML = '';
      document.getElementById('prioritySelect').value = '';
    }

    function updateRanking(criterion) {
      if (!currentCandidates.length || !criterion) return;

      var scored = currentCandidates.map(function (code) {
        return { code: code, label: LABELS[code], score: CRITERIA[code][criterion] };
      });
      scored.sort(function (a, b) { return b.score - a.score; });

      var html = scored.map(function (s, i) {
        return '<div>' + (i === 0 ? '&#9733; Best ma
